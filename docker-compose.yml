version: '3.8'

services:
  # ==================== 主应用 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen-social-agent
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8001
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen:1.8b
    depends_on:
      - redis
      - chromadb
      - ollama
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: qwen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - agent-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ==================== ChromaDB 向量数据库 ====================
  chromadb:
    image: chromadb/chroma:latest
    container_name: qwen-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - agent-network
    restart: unless-stopped

  # ==================== Ollama LLM 服务 ====================
  ollama:
    image: ollama/ollama:latest
    container_name: qwen-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - agent-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==================== Nginx 反向代理（可选） ====================
  nginx:
    image: nginx:alpine
    container_name: qwen-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - agent-network
    restart: unless-stopped
    profiles:
      - production

# ==================== 网络配置 ====================
networks:
  agent-network:
    driver: bridge

# ==================== 数据卷 ====================
volumes:
  redis-data:
  chroma-data:
  ollama-data:
